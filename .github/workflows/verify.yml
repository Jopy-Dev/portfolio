name: Verify

on:
  pull_request:
    branches: [dev, main]
  push:
    branches:
      - "feat/**"
      - "fix/**"
      - "chore/**"
      - "docs/**"
      - "refactor/**"
      - "security/**"
      - "dependabot/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format · Lint · Typecheck · Build · Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pin npm
        run: npm install --global npm@12.0.2 --ignore-scripts
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify package provenance
        run: |
          npm audit signatures
          npm audit --audit-level=high
      - name: Run verification suite
        run: npm run verify

  invariants:
    name: Env/invariant guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pin npm
        run: npm install --global npm@12.0.2 --ignore-scripts
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run environment and invariant guards
        run: |
          npm run guard:env
          npm run guard:tokens

  public-leaks:
    name: Hidden URL leak guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pin npm
        run: npm install --global npm@12.0.2 --ignore-scripts
      - name: Install dependencies and build
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Run public-output guard
        run: npm run guard:public
      - name: Install verified Gitleaks release
        run: |
          curl --fail --silent --show-error --location --output /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar --extract --gzip --file /tmp/gitleaks.tar.gz --directory /tmp gitleaks
      - name: Scan working tree and history
        run: |
          /tmp/gitleaks dir --no-banner --redact --exit-code 1 --config .gitleaks.toml .
          /tmp/gitleaks git --no-banner --redact --exit-code 1 --config .gitleaks.toml .

  dependency-review:
    if: github.event_name == 'pull_request'
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
